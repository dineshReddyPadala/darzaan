# HTTPS virtual hosts for Darzaan production (43.204.158.44).
# Static roots: rsync web/dist and marketing_website/dist before go-live.
# API gateway must listen on 127.0.0.1:3000 (docker-compose.production.yml).

# Marketing — darzaan.com
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name darzaan.com www.darzaan.com;

  ssl_certificate     /etc/letsencrypt/live/darzaan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/darzaan.com/privkey.pem;

  root /var/www/darzaan/www;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Staff app — app.darzaan.com
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name app.darzaan.com;

  ssl_certificate     /etc/letsencrypt/live/darzaan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/darzaan.com/privkey.pem;

  root /var/www/darzaan/app;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# API — api.darzaan.com
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.darzaan.com;

  ssl_certificate     /etc/letsencrypt/live/darzaan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/darzaan.com/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}