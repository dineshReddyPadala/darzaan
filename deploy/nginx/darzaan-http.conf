# Port 80: ACME challenges and redirect everything else to HTTPS.
# Install under sites-enabled alongside darzaan.conf after certificates exist.
# Replace CERT paths in darzaan.conf with your certbot paths.

server {
  listen 80;
  listen [::]:80;
  server_name darzaan.com www.darzaan.com app.darzaan.com api.darzaan.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}